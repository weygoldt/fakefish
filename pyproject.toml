[project]
name = "fakefish"
version = "0.1.0"
description = "Electric-fish EOD playback: Teensy 4.1 firmware + stimulus-library toolchain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    # Sidecar CSVs scale with the session: an hours-long playback runs to hundreds of
    # thousands of pulses, and the reader/writer must stay swift at that size.
    "polars>=1.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "seaborn>=0.13",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    # The aligner came across from playback-explorer with property tests over
    # offset x drift; they are the reason the estimator survived a negative-offset
    # bug that only a generated case found.
    "hypothesis>=6.115",
    "pytest>=8.0",
    "ruff>=0.6",
]
# ONLY the library-REGENERATION path needs these, and only alongside the source
# recordings (which are not shipped): `fakefish-export scan/export` and
# `fakefish-synth-volleys analyze`. Flashing, `fakefish-build-card`, the galleries,
# `fakefish-pulse-log` and the whole `make check` gate run without them.
#
#   uv run --group export fakefish-export scan -c data/stimuli_config.yaml
#
# They are a separate group rather than a hard dependency because scikit-learn is a
# heavy install that the 99% case never touches. They are DECLARED rather than left
# implicit because without them the scan silently skipped every recording and wrote an
# empty manifest, from which `export` would regenerate an EMPTY stimulus library over
# the byte-frozen one (see the ImportError guard in export_teensy_stimuli.scan).
export = [
    "nixio>=1.5",          # opens the NIX/HDF5 pulse recordings
    "scikit-learn>=1.3",   # KMeans + silhouette: the spatial clustering that separates fish
]

[project.scripts]
# Codegen: shared/stim_constants.json -> stim_levels.h + _constants.py (no dataset needed):
fakefish-gen-constants = "fakefish.gen_constants:app"
# Regeneration path (needs the source recordings; not shipped):
fakefish-export = "fakefish.export_teensy_stimuli:app"
fakefish-synth-volleys = "fakefish.synthetic_volleys:app"
# Runs against the committed firmware library (no dataset needed):
fakefish-render = "fakefish.render_stimulus:app"
fakefish-pulse-log = "fakefish.pulse_log:app"
fakefish-session = "fakefish.plot_session:app"
fakefish-align-log = "fakefish.align_log:app"
fakefish-build-card = "fakefish.build_sd_card:app"
fakefish-simulate = "fakefish.simulate_firmware:app"
fakefish-gallery-volley = "fakefish.plot_volley_gallery:app"
fakefish-gallery-localization = "fakefish.plot_localization_gallery:app"
fakefish-gallery-loc-volley = "fakefish.plot_loc_volley_gallery:app"
fakefish-anatomy = "fakefish.plot_playback_anatomy:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakefish"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# `firmware/` holds the shared core + the Arduino sketches (C/C++); nothing for ruff there.
extend-exclude = ["firmware"]
